<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic PDF Downloader</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #e74c3c;
            --success-color: #27ae60;
            --error-color: #c0392b;
            --background-color: #ecf0f1;
            --card-background: #ffffff;
            --text-color: #2c3e50;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background-color: var(--card-background);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 600px;
            margin: 2rem;
        }

        h1 {
            color: var(--primary-color);
            margin-bottom: 1.5rem;
            text-align: center;
            font-size: 2rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--primary-color);
            font-weight: 500;
        }

        input[type="url"] {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        input[type="url"]:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        button {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #34495e;
        }

        button:disabled {
            background-color: #95a5a6;
            cursor: not-allowed;
        }

        .status {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 8px;
            text-align: center;
            font-weight: 500;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .status.visible {
            opacity: 1;
        }

        .status.processing {
            background-color: #f7f9fa;
            color: var(--primary-color);
        }

        .status.success {
            background-color: #d4edda;
            color: var(--success-color);
        }

        .status.error {
            background-color: #f8d7da;
            color: var(--error-color);
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Comic PDF Downloader</h1>
        <form id="downloadForm">
            <div class="form-group">
                <label for="url">URL da HQ:</label>
                <input type="url" id="url" required 
                       placeholder="https://readallcomics.com/example-comic/">
            </div>
            <button type="submit" id="submitButton">Baixar PDF</button>
        </form>
        <div id="status" class="status"></div>
    </div>

    <script>
        const form = document.getElementById('downloadForm');
        const submitButton = document.getElementById('submitButton');
        const statusDiv = document.getElementById('status');
        const originalButtonText = submitButton.textContent;

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type} visible`;
        }

        function setLoading(isLoading) {
            submitButton.disabled = isLoading;
            if (isLoading) {
                submitButton.innerHTML = '<div class="loading"></div>Processando...';
                showStatus('Baixando e processando as imagens...', 'processing');
            } else {
                submitButton.textContent = originalButtonText;
            }
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            
            try {
                const response = await fetch('/download', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        url: document.getElementById('url').value
                    })
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    showStatus('PDF gerado com sucesso!', 'success');
                    window.location.href = `/download/${result.filename}`;
                } else {
                    throw new Error('Erro ao processar a HQ');
                }
            } catch (error) {
                showStatus('Não foi possível processar sua solicitação. Tente novamente mais tarde.', 'error');
            } finally {
                setLoading(false);
            }
        };
    </script>
</body>
</html>
